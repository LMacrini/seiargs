name: "Build/Deploy Docs"

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: [ubuntu-latest]

    steps:
      - name: Checkout repository
        uses: https://code.forgejo.org/actions/checkout@v4

      - name: Build docs
        run: nix build .#docs

      - name: Deploy docs
        uses: https://git.serversmp.xyz/actions/sites-deploy@v1
        with:
          folder: ./result/
          clean: true
